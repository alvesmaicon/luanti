# Luanti on the A33 (Mali-400 GLES2, 512 MB): copied once to ~/.minetest/minetest.conf by run.sh
video_driver = ogles2
fullscreen = true
screen_w = 640
screen_h = 480
autosave_screensize = false
fps_max = 30
fps_max_unfocused = 10
menu_last_game = minetest_game
# the main menu without what needs the network or a keyboard (patch 0015)
menu_handheld = true

# GPU: 8 chunks at the full 640x480 (narrower fov), no second render pass, no shadows or waving;
# Video goes up to 20 chunks, slower but playable
viewing_range = 128
# a world shows once the terrain in view is loaded and drawn, as far as the view goes (up to 320 nodes), far meshes
# too, not while it builds itself (patch 0027); a new world's has to be made first, up to the minute
loading_terrain_radius = 320
loading_terrain_timeout = 60
fov = 60
fog_start = 0.75
undersampling = 1
enable_post_processing = false
enable_dynamic_shadows = false
enable_3d_clouds = false
menu_clouds = false
enable_minimap = false
leaves_style = opaque
translucent_liquids = false
client_mesh_chunk = 1
# regions past 160 nodes (a view over 10 chunks) drawn from simplified meshes
client_lod_distance = 160
# the shield in the left hand (patch 0022), close: lowered only its top right corner at the bottom left, raised flat in
# front, its right edge at the crosshair
offhand_position = (-24, -27, 35)
offhand_rotation = (0, -10, 0)
offhand_raised_position = (-18, -17, 38)
offhand_raised_rotation = (0, 0, 0)

# CPU and RAM: few active blocks; blocks out of view expire after two minutes, so memory follows what is seen
active_block_range = 2
max_block_send_distance = 20
max_block_generate_distance = 20
# 5.17's queues; 5.18 raised them to 50 and 1200/150/150
max_simultaneous_block_sends_per_client = 40
emergequeue_limit_total = 1024
emergequeue_limit_diskonly = 128
emergequeue_limit_generate = 128
client_mapblock_limit = 2000
client_unload_unused_data_timeout = 120
client_unload_out_of_view = true

# Controls by position as on an Xbox pad (here B is at the bottom, A right, X top, Y left): R1 digs, L1 places,
# R2/L2 change slot, B jumps, A sneaks, X/Y open the inventory, L3 runs (goodluck_sprint), D-pad up camera, down drops.
# L1 with no block in hand, or sneaking, holds up the shield (goodluck_shield); L1 held draws a bow, let go it shoots (goodluck_bow).
# run.sh hands Luanti A and B by position: B (bottom) is GAMEPAD_BUTTON_0, A (right) GAMEPAD_BUTTON_1
keymap_jump = SYSTEM_SCANCODE_44|GAMEPAD_BUTTON_0
keymap_sneak = SYSTEM_SCANCODE_225|GAMEPAD_BUTTON_1
keymap_dig = MOUSE_BUTTON_1|GAMEPAD_BUTTON_10
keymap_place = MOUSE_BUTTON_3|GAMEPAD_BUTTON_9
keymap_hotbar_next = SYSTEM_SCANCODE_17|GAMEPAD_AXIS_PLUS_5
keymap_hotbar_previous = SYSTEM_SCANCODE_5|GAMEPAD_AXIS_PLUS_4
keymap_inventory = SYSTEM_SCANCODE_12|GAMEPAD_BUTTON_2|GAMEPAD_BUTTON_3
keymap_aux1 = SYSTEM_SCANCODE_8|GAMEPAD_BUTTON_7
keymap_camera_mode = SYSTEM_SCANCODE_6|GAMEPAD_BUTTON_11
keymap_zoom = SYSTEM_SCANCODE_29
goodluck_sprint_speed = 1.5
# running widens the view this much (1: not at all)
goodluck_sprint_fov = 1.1

# Survival: stamina's hunger without its own sprint (L3 runs and drains it); no mobs_redo limit on mobs in play (its
# count drifts with animals that stay, and past it it deletes them: goodluck_mobs caps monsters and animals per place,
# and run.sh keeps this value); hunger in the hearts' row on the right, above the XP bar (goodluck_hud puts armor
# above the hearts and breath above hunger, and moves hunger there on configs from before the bar)
sprint = false
mob_active_limit = 0
# no name and health text when the crosshair is on a mob, as in Minecraft
mob_infotext = false
# a mob that takes damage flashes red for a moment, as in Minecraft (goodluck_mobs sets the red)
mob_hit_effect = true
# broken blocks fall to the ground (goodluck_item_drop), and what lies there goes away after 5 minutes, as in
# Minecraft (Luanti keeps it 15)
item_entity_ttl = 300
# stacks of 64 and running hunger as in Minecraft (goodluck_hunger makes walking free)
default_stack_max = 64
stamina_sprint_drain = 0.15
stamina_hud_x = 25
stamina_hud_y = -100
